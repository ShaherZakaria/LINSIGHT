<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Linsight">
  <title>Linsight</title>
  <defs>
    <!-- Only what falls inside the lens is re-drawn in severity colour. -->
    <clipPath id="lens">
      <circle cx="158" cy="104" r="52"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="52" fill="#0f1419"/>

  <!-- the collection: rows of raw artifact output, undifferentiated -->
  <g fill="#2b3440">
    <rect x="34" y="54"  width="132" height="14" rx="7"/>
    <rect x="34" y="82"  width="180" height="14" rx="7"/>
    <rect x="34" y="110" width="104" height="14" rx="7"/>
    <rect x="34" y="138" width="158" height="14" rx="7"/>
    <rect x="34" y="166" width="120" height="14" rx="7"/>
  </g>

  <!-- the same rows, ranked, but only where the lens is looking -->
  <g clip-path="url(#lens)">
    <rect x="34" y="54"  width="132" height="14" rx="7" fill="#ff5f56"/>
    <rect x="34" y="82"  width="180" height="14" rx="7" fill="#ff9f43"/>
    <rect x="34" y="110" width="104" height="14" rx="7" fill="#ffd93d"/>
    <rect x="34" y="138" width="158" height="14" rx="7" fill="#5ad1e6"/>
  </g>

  <!-- the lens -->
  <circle cx="158" cy="104" r="52" fill="none" stroke="#58a6ff" stroke-width="13"/>
  <line x1="196" y1="142" x2="224" y2="170"
        stroke="#58a6ff" stroke-width="18" stroke-linecap="round"/>
</svg>
