title: Executable owned by a daemon account under a world-writable directory
id: b6660743-56e8-452e-a055-d02b9847ca30
status: experimental
description: |
  A file with the execute bit set, sitting in /tmp, /var/tmp or /dev/shm, and
  owned by an account that exists to run a service. Every part of that is
  wrong at once. The package manager does not put executables there; a daemon
  does not write executables at all; and the only way a file lands there owned
  by www-data or daemon is that something running as the web server or the
  cron daemon wrote it - which is what a payload dropped through a web
  vulnerability looks like on disk.
  This is the filesystem half of a finding whose process half may be long
  gone. Both hosts in this repository have exactly one row each, and both are
  the intrusion:
    - /var/tmp/dk86, -rwxr-xr-x, owner daemon - the AzurePot honeypot, the
      same 'daemon' account whose crontab was fetching ap.sh.
    - /tmp/apache-xTRhUVX, -rwxr-xr-x, owner www-data - VulnOSv2, written at
      11:04:14, thirteen minutes before the web shell was used.
  Reads the filesystem tables directly, so it works on a disk image with no
  process listing and no logs at all.
author: linsight
date: 2026-08-26
logsource:
  product: linux
  category: file_event
detection:
  temp_path:
    path|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
      - '/run/shm/'
  executable:
    mode|contains: 'x'
  daemon_owner:
    owner:
      - 'www-data'
      - 'daemon'
      - 'apache'
      - 'httpd'
      - 'nginx'
      - 'mail'
      - 'ftp'
      - 'nobody'
      - 'postfix'
      - 'tomcat'
      - 'jenkins'
      - 'redis'
      - 'memcache'
      - 'mysql'
      - 'postgres'
      - 'lp'
      - 'news'
      - 'uucp'
      - 'proxy'
      - 'list'
      - 'irc'
      - 'gnats'
      - 'games'
      - 'bin'
      - 'sys'
  directory:
    mode|startswith: 'd'
  systemd_private:
    path|contains:
      - 'systemd-private-'
      - '/tmp/.X11-unix'
      - '/tmp/.ICE-unix'
      - '/tmp/.font-unix'
  condition: temp_path and executable and daemon_owner and not (directory or systemd_private)
fields:
  - path
  - mode
  - owner
  - uid
  - size
  - mtime_utc
  - ctime_utc
falsepositives:
  - A build or test process running as a service account that compiles into
    /tmp. That is real on CI hosts and rare on servers - read the mtime
    against the rest of the timeline.
  - Directories are filtered out explicitly, because every directory carries
    the execute bit and /tmp is full of them.
level: critical
tags:
  - attack.execution
  - attack.t1059
  - attack.persistence
  - attack.defense_evasion
  - attack.t1036
