title: SSH session accepted for an account that exists to run a daemon
id: d6728bce-cae7-4716-b55a-3f0937a4b346
status: experimental
description: |
  sshd accepted an interactive session for a system account. These accounts
  ship with /usr/sbin/nologin precisely so that this cannot happen; a
  successful login as one of them means the shell was changed and a password
  or key was set, both of which are attacker work.
  This is the row that turns a brute-force finding into a breach. On the host
  this was written against, one address made 2,198 failed attempts and was
  then accepted for 'mail' - after which mail was in the sudo group and
  running 'su -'.
author: linsight
date: 2026-08-26
logsource:
  product: linux
  service: sshd
detection:
  accepted:
    event|contains:
      - 'accepted login'
  accepted_raw:
    message|startswith:
      - 'Accepted password for'
      - 'Accepted publickey for'
      - 'Accepted keyboard-interactive for'
  daemon_account:
    user:
      - 'daemon'
      - 'bin'
      - 'sys'
      - 'sync'
      - 'games'
      - 'man'
      - 'lp'
      - 'mail'
      - 'news'
      - 'uucp'
      - 'proxy'
      - 'www-data'
      - 'apache'
      - 'httpd'
      - 'nginx'
      - 'backup'
      - 'list'
      - 'irc'
      - 'gnats'
      - 'nobody'
      - 'ftp'
      - 'postfix'
      - 'sshd'
      - 'syslog'
      - 'messagebus'
      - 'uuidd'
      - 'tss'
      - 'landscape'
      - 'pollinate'
      - 'memcache'
      - 'memcached'
      - 'rabbitmq'
      - 'zabbix'
      - 'nagios'
  condition: (accepted or accepted_raw) and daemon_account
fields:
  - timestamp_utc
  - user
  - source_ip
  - port
  - message
falsepositives:
  - Backup and monitoring products that ship an account by one of these names
    and log in over SSH as it - check whether the account's shell was set by
    the package or by hand.
  - postgres, mysql, jenkins and tomcat are deliberately absent; they are
    genuinely logged into on many hosts.
level: critical
tags:
  - attack.persistence
  - attack.t1078.003
  - attack.lateral_movement
  - attack.t1021.004
