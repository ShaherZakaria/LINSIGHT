title: Service account replacing its own crontab
id: 2297a491-6ba0-4b31-9890-f5937d7b41f9
status: experimental
description: |
  A crontab REPLACE for an account that exists to run a daemon and has no
  interactive use - daemon, www-data, apache, nginx, nobody. Those accounts
  are not administered by hand, so a crontab being written for one is either
  an installer running as the wrong user or persistence. Repeated REPLACEs
  minutes apart are a loader reinstalling itself against something that keeps
  removing it.
author: linsight
date: 2026-08-26
logsource:
  product: linux
  service: cron
detection:
  replace:
    message|contains: 'REPLACE'
  account:
    message|contains:
      - '(daemon)'
      - '(www-data)'
      - '(apache)'
      - '(httpd)'
      - '(nginx)'
      - '(nobody)'
      - '(games)'
      - '(mail)'
  condition: replace and account
fields:
  - timestamp_utc
  - process
  - message
falsepositives:
  - Configuration management that legitimately installs a crontab for a
    service account. It should still be identifiable and expected.
level: high
tags:
  - attack.persistence
  - attack.t1053.003
