title: A daemon account added to an administrative group
id: 50ae6c7a-5695-4314-9984-d9470f80871b
status: experimental
description: |
  sudo, wheel, admin, docker, lxd, disk or shadow membership granted to an
  account that exists to run a daemon. Every one of these groups is root by
  another route - docker and lxd because the socket mounts the host
  filesystem, disk and shadow because they read the raw device and the hashes.
  These accounts are named here because nothing should ever authenticate as
  them, so nothing should ever need them to be able to escalate. On the host
  this was written against, 'mail' - uid 8, the Debian delivery account - was
  added to sudo three minutes after its password was reset, and used
  'sudo /bin/su -' five times in the following ten minutes.
author: linsight
date: 2026-08-26
logsource:
  product: linux
  service: sudo
detection:
  group_change:
    event|contains:
      - 'group membership change'
      - 'group member added'
      - 'added to group'
  admin_group:
    target_group:
      - 'sudo'
      - 'wheel'
      - 'admin'
      - 'adm'
      - 'root'
      - 'docker'
      - 'lxd'
      - 'disk'
      - 'shadow'
      - 'sudoers'
  daemon_account:
    target_user:
      - 'daemon'
      - 'bin'
      - 'sys'
      - 'sync'
      - 'games'
      - 'man'
      - 'lp'
      - 'mail'
      - 'news'
      - 'uucp'
      - 'proxy'
      - 'www-data'
      - 'apache'
      - 'httpd'
      - 'nginx'
      - 'backup'
      - 'list'
      - 'irc'
      - 'gnats'
      - 'nobody'
      - 'ftp'
      - 'postfix'
      - 'sshd'
      - 'syslog'
      - 'messagebus'
      - 'uuidd'
      - 'tss'
      - 'landscape'
      - 'pollinate'
      - 'tomcat'
      - 'jenkins'
      - 'redis'
      - 'memcache'
      - 'memcached'
      - 'rabbitmq'
      - 'elasticsearch'
      - 'zabbix'
      - 'nagios'
  condition: group_change and admin_group and daemon_account
fields:
  - timestamp_utc
  - actor
  - target_user
  - target_group
  - detail
falsepositives:
  - Deployment tooling that puts a CI account such as jenkins or tomcat into
    docker or sudo on purpose. That is a real weakness rather than a false
    positive, but it will be expected.
  - postgres and mysql are deliberately absent from this list; both are
    routinely su'd to by hand and would fire on most database hosts.
level: high
tags:
  - attack.persistence
  - attack.t1098
  - attack.privilege_escalation
  - attack.t1078.003
