title: PwnKit - polkit pkexec local privilege escalation (CVE-2021-4034)
id: c569760c-3490-4c7a-b70c-891402429161
status: experimental
description: |
  pkexec's argv[0]-is-NULL bug, reachable by any local user on a default
  install of every major distribution for twelve years. The exploit re-enters
  the process with a poisoned environment and gets a root shell before any
  authentication happens.
  Two things make it detectable. The exploit needs GCONV_PATH to point at a
  directory it controls, which appears in the recorded environment; and the
  unsuccessful or noisy variants leave a pkexec log line naming the SHELL
  variable it could not find. The upstream message is missing a word - it
  reads "was not found the /etc/shells file" - so both spellings are here.
  A clean exploit leaves neither, because it reaches the vulnerability before
  pkexec's own audit logging runs. Absence here is not evidence of absence.
  Not derived from evidence on the hosts in this repository - written from the
  Qualys advisory and published detection guidance.
references:
  - https://blog.qualys.com/vulnerabilities-threat-research/2022/01/25/pwnkit-local-privilege-escalation-vulnerability-discovered-in-polkits-pkexec-cve-2021-4034
  - https://nvd.nist.gov/vuln/detail/CVE-2021-4034
author: linsight
date: 2026-08-26
logsource:
  product: linux
  service: journald
detection:
  pkexec_log:
    message|contains:
      - 'The value for the SHELL variable was not found the /etc/shells file'
      - 'The value for the SHELL variable was not found in the /etc/shells file'
      - 'The value for environment variable'
  pkexec_log_suspicious:
    message|contains:
      - 'contains suspicious content'
      - '/etc/shells file'
  gconv_env:
    cmdline|contains:
      - 'GCONV_PATH='
      - 'CHARSET=payload'
  gconv_env_raw:
    message|contains:
      - 'GCONV_PATH='
  exploit_name:
    cmdline|contains:
      - 'pwnkit'
      - 'PwnKit'
      - 'cve-2021-4034'
      - 'CVE-2021-4034'
  exploit_name_raw:
    message|contains:
      - 'pwnkit'
      - 'cve-2021-4034'
  condition: (pkexec_log and pkexec_log_suspicious) or 1 of gconv_env* or 1 of exploit_name*
fields:
  - timestamp_utc
  - uid
  - comm
  - cmdline
  - message
falsepositives:
  - GCONV_PATH has a legitimate use in locale development and in some
    cross-compilation toolchains. It has no legitimate use in a service
    account's environment.
  - The distribution's own /usr/lib/.../gconv/gconv-modules file was
    deliberately dropped from this rule - it matched a plain statx of the
    packaged file during testing, which is a read of the directory the exploit
    replaces, not the exploit.
  - A responder naming the CVE in a command line will match the exploit_name
    selection - the same trade the crimeware-names rule documents.
level: critical
tags:
  - attack.privilege_escalation
  - attack.t1068
