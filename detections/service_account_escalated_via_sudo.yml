title: A daemon account used sudo or su
id: ff2b46f2-345c-4534-bea0-90fe67cc2e9a
status: experimental
description: |
  sudo or su invoked by an account that has no human behind it. Whoever ran it
  had a shell as that account, which for a daemon account is already the
  finding; the sudo is the second half of the same intrusion.
  The command is often 'su -' rather than anything specific, because the point
  is not to run one privileged command - it is to stop being the service
  account.
author: linsight
date: 2026-08-26
logsource:
  product: linux
  service: sudo
detection:
  escalation:
    event|contains:
      - 'sudo command'
      - 'sudo denied'
      - 'su'
  daemon_actor:
    actor:
      - 'daemon'
      - 'bin'
      - 'sys'
      - 'games'
      - 'man'
      - 'lp'
      - 'mail'
      - 'news'
      - 'uucp'
      - 'proxy'
      - 'www-data'
      - 'apache'
      - 'httpd'
      - 'nginx'
      - 'backup'
      - 'list'
      - 'irc'
      - 'gnats'
      - 'nobody'
      - 'ftp'
      - 'postfix'
      - 'sshd'
      - 'syslog'
      - 'messagebus'
      - 'uuidd'
      - 'tss'
      - 'memcache'
      - 'memcached'
      - 'rabbitmq'
      - 'zabbix'
      - 'nagios'
  condition: escalation and daemon_actor
fields:
  - timestamp_utc
  - actor
  - target_user
  - command
  - tty
  - working_dir
falsepositives:
  - A packaged init script that drops to a service account and sudos back for
    one step. Those repeat on a schedule with the same command; an intrusion
    shows a tty and a working directory.
  - postgres and mysql are deliberately absent - 'sudo -u postgres' is normal
    administration, and the actor recorded for it is the administrator anyway.
level: critical
tags:
  - attack.privilege_escalation
  - attack.t1548.003
  - attack.t1078.003
