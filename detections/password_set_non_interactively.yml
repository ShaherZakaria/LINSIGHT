title: Account password set by chpasswd rather than typed at passwd
id: 1542ad69-cc8b-4106-adfe-9074aee30353
status: experimental
description: |
  PAM records which program changed a password. 'passwd' means somebody typed
  it at a prompt; 'chpasswd' means a script piped 'user:password' into it,
  which is how a password is set over a non-interactive shell - a web shell, a
  command injection, or the tail of a dropper.
  On the host this was written against, the password for the 'mail' account
  was set by chpasswd, and that account was accepted over SSH shortly
  afterwards. The distinction is in the PAM service name and nowhere else:
  both write the same 'password changed for <user>' text.
author: linsight
date: 2026-08-26
logsource:
  product: linux
  service: auth
detection:
  scripted:
    detail|contains:
      - 'pam_unix(chpasswd:chauthtok)'
      - 'chpasswd:chauthtok'
  scripted_raw:
    message|contains:
      - 'pam_unix(chpasswd:chauthtok)'
  condition: 1 of scripted*
fields:
  - timestamp_utc
  - target_user
  - detail
falsepositives:
  - Cloud-init, kickstart and configuration management set passwords this way
    at build time. Compare the timestamp against the host's install date - the
    provisioning burst is at the very start of the log, an intrusion is not.
level: medium
tags:
  - attack.persistence
  - attack.t1098
  - attack.credential_access
