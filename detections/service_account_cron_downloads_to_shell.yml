title: Cron job for a service account downloads and pipes to a shell
id: 49108be3-df40-4ff0-8966-c54aac1c1248
status: experimental
description: |
  A cron CMD line for a non-interactive service account that fetches a remote
  script and executes it. This is the whole persistence mechanism of the
  commodity Linux crimeware families - the crontab is the implant, and the
  payload is re-fetched on every run so that deleting the binary achieves
  nothing.
author: linsight
date: 2026-08-26
logsource:
  product: linux
  service: cron
detection:
  account:
    message|contains:
      - '(daemon) CMD'
      - '(www-data) CMD'
      - '(apache) CMD'
      - '(nginx) CMD'
      - '(nobody) CMD'
      - '(games) CMD'
      - '(mail) CMD'
  fetch:
    message|contains:
      - 'wget '
      - 'curl '
  execute:
    message|contains:
      - '|bash'
      - '| bash'
      - '|sh'
      - '| sh'
  condition: account and fetch and execute
fields:
  - timestamp_utc
  - process
  - message
falsepositives:
  - None expected on a server.
level: critical
tags:
  - attack.persistence
  - attack.t1053.003
  - attack.command_and_control
  - attack.t1105
