title: Passwordless sudo granted to a service account
id: 693e0ea2-0da3-4c09-ab02-36a9f8fec6e7
status: experimental
description: |
  A NOPASSWD sudoers rule whose subject is an account that runs a daemon.
  Anything that gets code execution as that account is root, with no
  credential needed and no prompt to fail.
  Read the command the rule permits, not just the account. A NOPASSWD entry
  scoped to one binary still hands over root whenever that binary can be made
  to read or write an arbitrary path - on the AzurePot host the monitoring
  agent is granted passwordless '/bin/tail *' and '/usr/bin/touch', which is
  arbitrary file read and arbitrary file creation as root, and one account is
  granted plain 'NOPASSWD: ALL'.
  Those particular entries are vendor-shipped rather than attacker-planted,
  which is the point: this rule reports the standing weakness that makes a web
  compromise into a root compromise, whoever installed it.
author: linsight
date: 2026-08-26
logsource:
  product: linux
  service: sudoers_file
detection:
  passwordless:
    rule|contains: 'NOPASSWD'
  service_subject:
    rule|startswith:
      - 'www-data'
      - 'daemon'
      - 'apache'
      - 'httpd'
      - 'nginx'
      - 'mail'
      - 'ftp'
      - 'nobody'
      - 'postfix'
      - 'tomcat'
      - 'jenkins'
      - 'redis'
      - 'memcache'
      - 'mysql'
      - 'postgres'
      - 'omsagent'
      - 'nxautomation'
      - 'zabbix'
      - 'nagios'
      - 'telegraf'
      - 'prometheus'
      - 'node_exporter'
      - '%www-data'
      - '%daemon'
      - '%nginx'
  condition: passwordless and service_subject
fields:
  - file
  - line_no
  - rule
  - nopasswd
falsepositives:
  - Monitoring and configuration-management agents ship these deliberately -
    the Azure OMS agent alone accounts for thirty entries on one of the hosts
    here. Expected is not the same as safe; the finding is the blast radius,
    and the triage question is whether each permitted command can read, write
    or execute something the account chooses.
level: high
tags:
  - attack.privilege_escalation
  - attack.t1548.003
